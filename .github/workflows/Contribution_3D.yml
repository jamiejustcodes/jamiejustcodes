name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "30 21 * * *" # runs daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contributions
        uses: shaaravraghu/github-profile-3D@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Customize 3D Contribution Graph and Embed Stickers
        run: |
          find profile-3d-contrib -type f ! -name "profile-gitblock.svg" -delete

          python3 - <<'PY'
          import os
          import re
          import base64
          from pathlib import Path

          svg_file = Path("profile-3d-contrib/profile-gitblock.svg")
          if not svg_file.exists():
              print("No profile-gitblock.svg found, skipping customization.")
              exit(0)

          svg = svg_file.read_text(encoding="utf-8")

          BACKGROUND = os.environ.get("GRAPH_BG", "#f7e700")

          if BACKGROUND.lower() != "transparent":
              svg = re.sub(
                  r"<svg([^>]*)>",
                  lambda m: f'<svg{m.group(1)} style="background:{BACKGROUND};">',
                  svg,
                  count=1
              )

              background_rect = f"""
              <rect x="0" y="0" width="1280" height="850" fill="{BACKGROUND}"/>
              """
              svg = re.sub(r"(<svg[^>]*>)", r"\1" + background_rect, svg, count=1)

          STICKER_CONFIGS = [
              {"name": "DP.png", "x": 0, "y": 450, "width": 400, "height": 400},
              {"name": "Among_Us.png", "x": 1075, "y": 20, "width": 175, "height": 175},
              {"name": "CEO.png", "x": 10, "y": -50, "width": 200, "height": 200},
              {"name": "Claude_Crab.jpeg", "x": 600, "y": 680, "width": 175, "height": 175},
              {"name": "Dino.png", "x": 410, "y": 660, "width": 175, "height": 175},
              {"name": "Eat_Sleep_Code_Repeat.jpeg", "x": 325, "y": 10, "width": 150, "height": 150},
              {"name": "Error_404.jpeg", "x": 475, "y": 10, "width": 150, "height": 150},
              {"name": "Think_OutSide_The_Box.jpeg", "x": 625, "y": 10, "width": 150, "height": 150},
          ]

          MIME_TYPES = {
              ".png": "image/png",
              ".jpg": "image/jpeg",
              ".jpeg": "image/jpeg",
              ".svg": "image/svg+xml",
              ".webp": "image/webp",
          }

          embedded_images = []
          for item in STICKER_CONFIGS:
              p = Path("stickers") / item["name"]
              if not p.exists():
                  p = Path(item["name"])

              if p.exists():
                  ext = p.suffix.lower()
                  mime_type = MIME_TYPES.get(ext, "image/png")
                  b64 = base64.b64encode(p.read_bytes()).decode("ascii")
                  img_tag = f"""
                  <image
                    x="{item['x']}"
                    y="{item['y']}"
                    width="{item['width']}"
                    height="{item['height']}"
                    preserveAspectRatio="xMidYMid meet"
                    href="data:{mime_type};base64,{b64}"
                  />
                  """
                  embedded_images.append(img_tag)
                  print(f"Embedded sticker: {item['name']}")

          if embedded_images and "</svg>" in svg:
              svg = svg.replace("</svg>", "\n".join(embedded_images) + "\n</svg>", 1)

          svg_file.write_text(svg, encoding="utf-8")
          print("Successfully customized profile-gitblock.svg")
          PY

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-3d-contrib/

          if git commit -m "Update 3D contribution graph"; then
            git push
          else
            echo "No changes to commit."
          fi
